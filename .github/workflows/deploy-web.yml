name: Deploy sito

# Pubblica il sito su GitHub Pages a ogni push su main che tocca main/, oppure a mano da Actions.
# URL e chiave publishable di Supabase sono in main/.env.production (pubblici per progetto:
# la sicurezza sta nelle funzioni SQL).
on:
  # L'ambiente github-pages accetta solo il ramo main (non i tag): il sito si aggiorna a ogni push su main.
  push:
    branches: [main]
    paths: ['main/**', '.github/workflows/deploy-web.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    defaults:
      run:
        working-directory: main
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: main/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build  # legge main/.env.production
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: main/dist
      - id: deployment
        uses: actions/deploy-pages@v4
